<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Identificação | TraceBag</title><link rel="stylesheet" href="style.css"></head>
<body><main><h1>TraceBag</h1><h2>Identificação da bagagem</h2><p id="identificacao"></p><p>O serviço de aviso ao proprietário ainda não está disponível. Se encontrou esta bagagem, entregue-a ao setor de achados e perdidos do local.</p><a href="index.html">Página inicial</a></main>
<script>
const id = new URLSearchParams(location.search).get('id') || '';
document.getElementById('identificacao').textContent = /^TB-[A-F0-9]{32}$/.test(id) ? 'Código: ' + id : 'Código de bagagem inválido ou ausente.';
</script></body></html>
